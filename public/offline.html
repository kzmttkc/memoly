<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#243B6E">
<title>オフラインです | 番頭(Banto)</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
    background: #F5F0E6;
    color: #1f2937;
  }
  .box { text-align: center; padding: 24px; max-width: 420px; }
  .mark {
    width: 64px; height: 64px; border-radius: 16px; margin: 0 auto 16px;
    background: #243B6E; color: #fff; display: grid; place-items: center;
    font-size: 28px; font-weight: 700; font-family: sans-serif;
  }
  h1 { font-size: 18px; margin: 0 0 8px; color: #243B6E; }
  p { font-size: 14px; line-height: 1.8; color: #4b5563; margin: 0 0 20px; }
  button {
    appearance: none; border: 0; border-radius: 12px; padding: 12px 24px;
    background: #243B6E; color: #fff; font-size: 14px; cursor: pointer;
  }
  button:hover { opacity: .9; }
</style>
</head>
<body>
  <div class="box">
    <div class="mark">B</div>
    <h1>オフラインのようです</h1>
    <p>インターネット接続が確認できませんでした。接続が戻りましたら、下のボタンで再読み込みしてください。</p>
    <button id="reload">再読み込み</button>
  </div>
  <!-- CSPは script-src-attr 'none' のためインラインonclickは使わない（script要素はscript-srcの'unsafe-inline'で許可）。 -->
  <script>
    document.getElementById('reload').addEventListener('click', function () {
      location.reload()
    })
  </script>
</body>
</html>
