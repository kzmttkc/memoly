name: dependency-scan

# 依存の既知脆弱性を継続監視する（供給網リスクの早期検知）。
#   - push / PR で high 以上の脆弱性が入っていないかを検査
#   - 週次(月曜 JST 昼)でも定点観測（新規CVEの後追い検知）
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 毎週月曜 03:00 UTC = 12:00 JST
    - cron: '0 3 * * 1'

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # lockfile と厳密一致でインストール（監査対象を再現可能にする）。
      - run: npm ci
      # 本番依存の high 以上で失敗させる（開発依存のノイズで赤くしすぎない）。
      # moderate 以下は継続監視（レポートは下の全体監査で出す）。
      #
      # ★このステップに `|| true` を足して緑にしない（2026-07-30 監査#8）。
      #   2026-07 時点で main の直近15件が全部 failure だった原因は postcss 3件・sharp 1件
      #   （いずれも next@16.2.12 の推移依存）。package.json の "overrides" で
      #   postcss ^8.5.18 / sharp ^0.35.0 に引き上げて **実際に解消**した（実測 0件）。
      #   next のメジャー更新でこれらが不要になったら overrides を外して再確認すること。
      #   将来どうしても解消できない脆弱性が出たときだけ、理由と再確認予定日を書いた
      #   許容リスト（--audit-level の引き上げではなく個別の除外）にする。
      - name: Audit production deps (fail on high)
        run: npm audit --omit=dev --audit-level=high
      # 開発依存を含む全体でも high 以上を落とす（2026-08-13）。
      #   従来ここは `|| true` の参考情報だったため、high 3件（brace-expansion /
      #   js-yaml / nanoid・いずれも fixAvailable:true）が**誰にも止められずに**
      #   放置され、セキュリティ採点で -2 になった。開発依存であっても、
      #   ビルド機と開発機で実行されるコードであり供給網攻撃の入口になる。
      #   3件は 2026-08-13 に npm audit fix（package-lock のみ更新）で 0 件にした。
      #   ★`|| true` を戻さない。解消できない件が出たときは、理由と再確認予定日を
      #     書いたうえで個別に除外する（--audit-level の引き上げで丸ごと甘くしない）。
      - name: Audit all deps incl. dev (fail on high)
        if: always()
        run: npm audit --audit-level=high
